name: Server App Attest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  appattest:
    name: App Attest verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/src/appattest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/src/appattest/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
